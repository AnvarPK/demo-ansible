---
- name: Diagnose and Remediate High CPU Usage
  hosts: all
  become: yes
  gather_facts: false

  tasks:
  
    - name: Show received data
      debug:
        msg:
          - "Entity: {{ entity_name }}"
          - "Service: {{ service_name }}"
          - "Event: {{ event_id }}"
          - "Severity: {{ severity }}"
`
    - name: Log remediation execution
      shell: |
        echo "Instana remediation executed at $(date)" >> /tmp/instana-remediation.log

    - name: Kill CPU stress processes
      shell: pkill yes || true
